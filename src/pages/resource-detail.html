<!-- META_TITLE: Resource View | ScITech Knowledge Library -->
<!-- META_DESC: Detailed view and download page for ScITech research guides, checklists, and templates. -->
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
{{HEAD}}
</head>
<body class="bg-white text-body font-sans antialiased selection:bg-[#38D9F5]/30">

{{HEADER}}

<main id="main-content" class="py-16 bg-[#F5F8FC]">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div id="resource-detail-container" class="bg-white p-6 sm:p-10 rounded-3xl border border-soft-border shadow-sm">
      <div class="animate-pulse space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/4"></div>
        <div class="h-10 bg-gray-200 rounded w-3/4"></div>
        <div class="h-40 bg-gray-200 rounded"></div>
      </div>
    </div>

  </div>
</main>

{{FOOTER}}

<script type="module" src="src/js/main.js"></script>
<script type="module">
  import { RESOURCES } from './src/data/resources-data.js';

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const resId = params.get('id');
    const container = document.getElementById('resource-detail-container');

    const res = RESOURCES.find(r => r.id === resId) || RESOURCES[0];

    if (container && res) {
      container.innerHTML = `
        <div class="flex items-center justify-between gap-4 mb-6">
          <span class="badge-blue">${res.category}</span>
          <span class="text-xs font-mono text-muted">${res.format} • ${res.size}</span>
        </div>
        
        <h1 class="text-3xl sm:text-4xl font-bold text-body mb-6">${res.title}</h1>

        <div class="prose prose-slate max-w-none mb-8 text-sm text-body leading-relaxed bg-paper p-6 sm:p-8 rounded-2xl border border-soft-border">
          ${formatMarkdownText(res.description)}
        </div>

        <div class="pt-6 border-t border-soft-border flex flex-col sm:flex-row items-center justify-between gap-4">
          <a href="resources.html" class="btn-secondary w-full sm:w-auto text-center">Back to Resources</a>
          ${res.downloadFilename ? `
            <button onclick="alert('Sample Download: Initializing stream for ${res.downloadFilename}')" class="btn-primary w-full sm:w-auto text-center font-bold gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Download Resource (${res.format.split('/')[0].trim()})
            </button>
          ` : `
            <button onclick="window.print()" class="btn-secondary w-full sm:w-auto text-center gap-2">
              Print Guide
            </button>
          `}
        </div>
      `;
    }
  });

  function formatMarkdownText(text) {
    if (!text) return '';
    return text
      .replace(/^### (.*$)/gim, '<h3 class="text-lg font-bold mt-4 mb-2">$1</h3>')
      .replace(/^#### (.*$)/gim, '<h4 class="text-base font-semibold mt-3 mb-1.5">$1</h4>')
      .replace(/^- \[ \] (.*$)/gim, '<li class="flex items-start gap-2 my-1"><input type="checkbox" class="mt-1 rounded" disabled/> <span>$1</span></li>')
      .replace(/^- (.*$)/gim, '<li class="ml-4 list-disc my-1">$1</li>')
      .replace(/`([^`]+)`/g, '<code class="bg-gray-200 px-1 py-0.5 rounded text-xs font-mono">$1</code>');
  }
</script>
</body>
</html>
